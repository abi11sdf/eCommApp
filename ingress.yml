apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecom-try-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - ecom.healthitplatform.com
      secretName: ecomhealthitplatform-tls
  rules:
    - host: ecom.healthitplatform.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecom-try-service
                port:
                  number: 80






