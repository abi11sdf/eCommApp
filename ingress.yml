apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecom-try-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
spec:
  rules:
    - host: ecomhealthitplatform.com   # 👈 your Route 53 domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecom-try-service   # must match your Service name
                port:
                  number: 80
